<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yay! 💖 Happy Valentine's Day!</title>
    <link rel="stylesheet" href="styles.css">  <!-- reuse your existing Valentine styles -->
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            color: #c2185b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .content {
            max-width: 700px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.88);
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(216, 27, 96, 0.35);
            border: 3px solid #ff80ab;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 4.5em;
            margin: 0 0 20px;
            color: #d81b60;
            text-shadow: 3px 3px 10px rgba(216, 27, 96, 0.5);
            animation: pulse 2s infinite;
        }

        p {
            font-size: 2.2em;
            margin: 20px 0 40px;
            color: #e91e63;
        }

        .heart-big {
            font-size: 8rem;
            margin: 20px 0;
            animation: heartbeat 1.4s infinite;
        }

        /* Floating hearts background */
        .floating-hearts {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.7;
            animation: float-up linear infinite;
            color: #ff4081;
        }

        @keyframes float-up {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0.6; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.08); }
        }

        @keyframes heartbeat {
            0%, 40%, 80%, 100% { transform: scale(1); }
            20%, 60%           { transform: scale(1.25); }
        }
    </style>
</head>
<body>

    <div class="floating-hearts" id="heartsContainer"></div>

    <div class="content">
        <div class="tenor-gif-embed" data-postid="24884258" data-share-method="host" data-aspect-ratio="1.32231" data-width="100%"><a href="https://tenor.com/view/moti-hearts-gif-24884258">Moti Hearts GIF</a>from <a href="https://tenor.com/search/moti-gifs">Moti GIFs</a></div> <script type="text/javascript" async src="https://tenor.com/embed.js"></script>
        <h1>Yayyyy! 💕</h1>
        <p>Thank you for being my Valentine!<br>You're the best! 🐱❤️</p>

        <!-- Cute cat hugging heart GIF (pixel style – reliable link) -->
        <img 
            src="https://media.tenor.com/3550845/tenor.gif" 
            alt="Cute cat hugging a heart" 
            style="max-width: 220px; border-radius: 15px; box-shadow: 0 8px 20px rgba(233,30,99,0.4); margin: 25px auto; display: block;"
        >
    </div>

    <script>
        // Generate floating hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = ['❤️','💖','💗','💞','💓'][Math.floor(Math.random()*5)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 8 + 10) + 's'; // 10–18s
            heart.style.animationDelay = Math.random() * 5 + 's';
            heart.style.fontSize = (Math.random() * 1.5 + 1.8) + 'rem';

            document.getElementById('heartsContainer').appendChild(heart);

            // Remove after animation
            setTimeout(() => heart.remove(), 20000);
        }

        // Create hearts continuously
        setInterval(createHeart, 800);
    </script>

</body>
</html>
